<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Haunted Dorm - Multiplayer</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>
:root{--bg:#0e0a1a;--card:#1c1530;--acc:#ffb020;--red:#e5484d;--grn:#3ecf8e;--txt:#f3eefc;--mut:#9b8fb8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));gap:12px;overflow:auto;touch-action:pan-y}
.screen.on{display:flex}
h1{margin:0;font-size:28px;letter-spacing:.5px}
h1 small{display:block;font-size:13px;color:var(--mut);font-weight:400;margin-top:4px}
.card{background:var(--card);border-radius:16px;padding:16px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px}
input[type=text]{width:100%;padding:13px 14px;border-radius:12px;border:2px solid #3a2f5c;background:#120d22;color:var(--txt);font-size:17px;outline:none;user-select:text;touch-action:auto}
input[type=text]:focus{border-color:var(--acc)}
.code-in{text-transform:uppercase;letter-spacing:6px;text-align:center;font-size:22px!important;font-weight:700}
button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:700;color:#1a1000;background:var(--acc);cursor:pointer}
button.sec{background:#33294f;color:var(--txt)}
button.red{background:var(--red);color:#fff}
button:disabled{opacity:.4}
.row{display:flex;gap:8px}.row>*{flex:1}
.err{color:#ff8a8f;font-size:14px;min-height:18px;text-align:center}
.codebox{font-size:44px;font-weight:800;letter-spacing:10px;text-align:center;color:var(--acc);padding:4px 0}
.plist{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:10px;background:#120d22;border-radius:10px;padding:9px 12px;font-size:16px}
.dot{width:14px;height:14px;border-radius:50%}
.tag{margin-left:auto;font-size:12px;color:var(--mut)}
.mut{color:var(--mut);font-size:13px;text-align:center;line-height:1.4}
label.chk{display:flex;gap:10px;align-items:center;font-size:15px;background:#120d22;padding:11px 12px;border-radius:10px}
label.chk input{width:20px;height:20px;accent-color:var(--acc)}
/* game */
#game{padding:0;gap:0;justify-content:flex-start;align-items:stretch;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) 10px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.pill{background:#000a;border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px;white-space:nowrap}
.ghostbar{flex:1;background:#000a;border-radius:10px;padding:5px 9px;font-size:12px}
.bar{height:8px;background:#3a1020;border-radius:4px;overflow:hidden;margin-top:3px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff5d6c,#ff9a5d);width:100%}
#toasts{position:absolute;left:10px;right:10px;top:66px;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
.toast{background:#000c;border-radius:10px;padding:7px 12px;font-size:14px;animation:fade 4.5s forwards;max-width:100%;text-align:center}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:#ffffff14;border:2px solid #ffffff30}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:#ffffff55}
#acts{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#acts button{min-width:150px;padding:11px 12px;font-size:14px;text-align:left}
#acts button small{display:block;font-weight:500;opacity:.8;font-size:11px}
#sleepBtn{background:#6c5ce7;color:#fff;font-size:17px!important;text-align:center!important;min-width:150px}
#atkBtn{background:var(--red);color:#fff;font-size:20px!important;text-align:center!important;padding:22px 26px!important}
#end{background:#000d;z-index:5}
#upgs{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
</style>
</head>
<body>

<div id="home" class="screen on">
  <h1>👻 Haunted Dorm<small>Real Multiplayer · Normal Mode</small></h1>
  <div class="card">
    <input id="name" type="text" maxlength="12" placeholder="Apna naam" autocomplete="off">
    <button id="btnCreate">➕ Room banao</button>
    <div class="mut">ya dost ka code daalo</div>
    <input id="codeIn" class="code-in" type="text" maxlength="4" placeholder="CODE" autocomplete="off">
    <button id="btnJoin" class="sec">🔑 Join karo</button>
    <div id="homeErr" class="err"></div>
  </div>
  <a href="index.html" style="color:var(--mut);font-size:14px">← Original game (single player)</a>
</div>

<div id="lobby" class="screen">
  <h1>Room Lobby</h1>
  <div class="card">
    <div class="mut">Dost ko ye code do</div>
    <div id="codeBox" class="codebox">----</div>
    <div class="row"><button id="btnCopy" class="sec">🔗 Invite link</button><button id="btnLeave" class="sec">🚪 Leave</button></div>
    <div id="plist" class="plist"></div>
    <label class="chk"><input id="demonChk" type="checkbox"> 😈 Mujhe Demon banna hai</label>
    <div id="lobbyInfo" class="mut"></div>
    <button id="btnStart">▶ Game Start</button>
    <div id="lobbyErr" class="err"></div>
  </div>
</div>

<div id="game" class="screen">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="pill" id="hCoins">🪙 0</div>
    <div class="pill" id="hEn">⚡ 0</div>
    <div class="ghostbar"><div id="hGhost">👻 Demon aane wala hai…</div><div class="bar"><i id="hGhostBar"></i></div></div>
  </div>
  <div id="toasts"></div>
  <div id="stick"><div id="knob"></div></div>
  <div id="acts">
    <div id="upgs"></div>
    <button id="sleepBtn">😴 Sleep</button>
    <button id="atkBtn" style="display:none">⚔️ ATTACK</button>
  </div>
</div>

<div id="end" class="screen">
  <h1 id="endTitle">Game Over</h1>
  <div class="card"><div id="endMsg" class="mut" style="font-size:16px"></div><button id="btnBack">Lobby me wapas</button></div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const COLORS = ['#ff6b6b', '#4dabf7', '#51cf66', '#ffd43b', '#cc5de8', '#ff922b', '#22b8cf'];
let ws, me = { id: 0, name: '' }, roomInfo = null, G = null;
const show = (id) => document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id));
$('name').value = localStorage.getItem('hd_name') || '';

/* ---------------- networking ---------------- */
function connect(cb) {
  if (ws && ws.readyState === 1) return cb && cb();
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onopen = () => { send({ t: 'hello', name: $('name').value }); cb && cb(); };
  ws.onmessage = (e) => onMsg(JSON.parse(e.data));
  ws.onclose = () => { if (G) toast('⚠️ Connection toot gaya, page refresh karo'); else { $('homeErr').textContent = 'Server se connection nahi hua'; show('home'); } };
}
const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
function saveName() { const n = $('name').value.trim() || 'Player' + ((Math.random() * 900 + 100) | 0); $('name').value = n; localStorage.setItem('hd_name', n); return n; }

$('btnCreate').onclick = () => { saveName(); connect(() => send({ t: 'create' })); };
$('btnJoin').onclick = () => { saveName(); const c = $('codeIn').value.trim(); if (c.length < 4) { $('homeErr').textContent = '4 letter ka code daalo'; return; } connect(() => send({ t: 'join', code: c })); };
$('btnLeave').onclick = () => { send({ t: 'leave' }); };
$('btnStart').onclick = () => send({ t: 'start' });
$('demonChk').onchange = (e) => send({ t: 'demon', on: e.target.checked });
$('btnBack').onclick = () => { G = null; if (roomInfo) { renderLobby(); show('lobby'); } else show('home'); };
$('btnCopy').onclick = async () => {
  const url = location.origin + location.pathname + '?join=' + roomInfo.code;
  try { if (navigator.share) await navigator.share({ title: 'Haunted Dorm', text: 'Mere room me aao! Code: ' + roomInfo.code, url }); else { await navigator.clipboard.writeText(url); $('lobbyErr').textContent = 'Link copy ho gaya ✔'; } } catch (e) { $('lobbyErr').textContent = url; }
};

function onMsg(m) {
  switch (m.t) {
    case 'hello': me.id = m.id; me.name = m.name; if (!$('name').value) $('name').value = m.name; break;
    case 'err': $('homeErr').textContent = m.m; $('lobbyErr').textContent = m.m; break;
    case 'left': roomInfo = null; G = null; show('home'); break;
    case 'room': roomInfo = m; if (!G) { show('lobby'); renderLobby(); } else if (!m.playing) { /* game finished */ } break;
    case 'init': startGame(m); break;
    case 's': if (G) onSnap(m); break;
    case 'toast': toast(m.m); break;
    case 'end': if (G) { G.over = true; $('endTitle').textContent = m.winner === 'survivors' ? '🎉 Survivors jeet gaye!' : '💀 Demon jeet gaya!'; $('endMsg').textContent = m.msg + ' · Demon level ' + m.ghostLv + ' · ' + Math.floor(m.time / 60) + 'm ' + (m.time % 60) + 's'; setTimeout(() => show('end'), 1200); } break;
  }
}
function renderLobby() {
  $('codeBox').textContent = roomInfo.code;
  const iAmHost = roomInfo.host === me.id;
  $('plist').innerHTML = roomInfo.players.map((p, i) => `<div class="pl"><span class="dot" style="background:${COLORS[i % 7]}"></span>${esc(p.name)}${p.id === me.id ? ' (tum)' : ''}<span class="tag">${p.demon ? '😈 Demon' : ''}${p.id === roomInfo.host ? ' 👑 host' : ''}</span></div>`).join('');
  const hum = roomInfo.players.length, dem = roomInfo.players.some((p) => p.demon);
  const surv = hum - (dem ? 1 : 0);
  $('lobbyInfo').textContent = `${hum}/${roomInfo.max} players · ${surv} survivor + ${Math.max(0, 6 - surv)} bot${dem ? ' · Demon = real player' : ' · Demon = AI'}`;
  $('demonChk').checked = !!(roomInfo.players.find((p) => p.id === me.id) || {}).demon;
  $('btnStart').style.display = iAmHost ? '' : 'none';
  if (!iAmHost) $('lobbyInfo').textContent += ' · Host ke start karne ka wait karo…';
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qs = new URLSearchParams(location.search);
if (qs.get('join')) $('codeIn').value = qs.get('join').toUpperCase().slice(0, 4);

/* ---------------- assets ---------------- */
const ATL = {};
const BASE = 'gameAssets/asset/res/atlas/';
function loadAtlas(name) {
  return fetch(BASE + name + '.atlas').then((r) => r.json()).then((j) => new Promise((res) => {
    const img = new Image(); img.onload = () => { ATL[name] = { img, fr: j.frames }; res(); }; img.onerror = res; img.src = BASE + name + '.png';
  })).catch(() => {});
}
const assetsReady = Promise.all(['map', 'build', 'Atower'].map(loadAtlas));
function spr(atlas, frame, x, y, ts, alpha) {
  const a = ATL[atlas]; const f = a && a.fr[frame + '.png'];
  if (!f) return false;
  const k = ts / 90, fr = f.frame, o = f.spriteSourceSize || { x: 0, y: 0 };
  if (alpha != null) cx.globalAlpha = alpha;
  cx.drawImage(a.img, fr.x, fr.y, fr.w, fr.h, x + o.x * k, y + o.y * k, fr.w * k, fr.h * k);
  if (alpha != null) cx.globalAlpha = 1;
  return true;
}

/* ---------------- game state ---------------- */
const cv = $('cv'), cx = cv.getContext('2d');
let W = 0, H = 0, TS = 48, dpr = 1;
function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; TS = Math.max(34, Math.min(64, Math.floor(Math.min(W, H * 0.75) / 8.5))); }
addEventListener('resize', resize);

function startGame(m) {
  G = { names: Object.fromEntries((m.players || []).map((p) => [p.id, p.name])), init: m, role: m.role, you: m.you, prev: null, cur: null, rooms: [], players: [], ghost: [0, 0, 1, 1, 0, 0], shots: [], over: false, time: 0, inX: 0, inY: 0, lastSent: '', cam: { x: 20, y: 20 } };
  $('toasts').innerHTML = '';
  $('atkBtn').style.display = m.role === 'demon' ? '' : 'none';
  $('sleepBtn').style.display = m.role === 'demon' ? 'none' : '';
  $('stick').style.display = '';
  $('upgs').style.display = m.role === 'demon' ? 'none' : '';
  $('hCoins').style.display = $('hEn').style.display = m.role === 'demon' ? 'none' : '';
  resize();
  assetsReady.then(() => { show('game'); resize(); requestAnimationFrame(frame); });
}
function onSnap(s) {
  const now = performance.now();
  s.arr = now;
  G.prev = G.cur; G.cur = s;
  G.time = s.time;
  if (s.r) G.rooms = s.r;
  if (s.ev) s.ev.forEach(toast);
  if (s.f) s.f.forEach((ri) => G.shots.push({ ri, until: now + 160 }));
  updateHud();
}
function toast(t) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; $('toasts').appendChild(d);
  while ($('toasts').children.length > 4) $('toasts').firstChild.remove();
  setTimeout(() => d.remove(), 4600);
}
const fmt = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'K' : String(Math.floor(n));
function myPlayer() { return G && G.cur ? G.cur.p.find((p) => p[0] === G.you) : null; }
function myRoom() { return G && G.rooms.find((r) => r[1] === G.you); }

function updateHud() {
  const c = G.cur, g = c.g, T = G.init.tables;
  const mp = myPlayer();
  if (mp) { $('hCoins').textContent = '🪙 ' + fmt(mp[4]); $('hEn').textContent = '⚡ ' + fmt(mp[5]); }
  const left = Math.max(0, Math.ceil(G.init.spawnAt - G.time));
  $('hGhost').textContent = g[5] === 0 ? '👻 Demon aane me ' + left + 's — taiyari karo!' : '👻 Demon L' + (g[4] + 1) + (g[5] === 2 ? ' (bhaag raha)' : '') + ' · ' + fmt(g[2]) + '/' + fmt(g[3]);
  $('hGhostBar').style.width = (g[3] ? Math.max(0, g[2] / g[3]) * 100 : 100) + '%';
  if (G.role === 'demon') return;
  // sleep button + upgrade buttons
  const room = myRoom();
  const sb = $('sleepBtn');
  if (!mp || mp[3] === 2) { sb.style.display = 'none'; $('upgs').innerHTML = ''; $('stick').style.display = 'none'; return; }
  sb.textContent = mp[3] === 1 ? '🚶 Uth jao' : '😴 Bed par so jao';
  const key = JSON.stringify([room, mp[4] >> 0, mp[5] >> 0, mp[3], inMyRoom()]);
  if (key === G.upKey) return;
  G.upKey = key;
  if (!room || !(mp[3] === 1 || inMyRoom())) { $('upgs').innerHTML = ''; return; }
  const [, , bed, door, dHp, dMax, bHp, bMax, at, game] = room;
  const rows = [];
  const add = (w, label, n, tbl, extra) => {
    if (n >= tbl.cost.length) { rows.push(`<button class="sec" disabled>${label} MAX</button>`); return; }
    const cost = tbl.cost[n], en = tbl.en[n];
    const ok = mp[4] >= cost && mp[5] >= en;
    rows.push(`<button data-w="${w}" ${ok ? '' : 'class="sec"'} style="${ok ? '' : 'opacity:.7'}">${label} → L${n + 1}<small>${fmt(cost)}🪙${en ? ' + ' + en + '⚡' : ''}${extra || ''}</small></button>`);
  };
  add('bed', '🛏 Bed', bed + 1, T.BED, T.BED.reqDoor[bed + 1] != null && door < T.BED.reqDoor[bed + 1] ? ' · Door L' + (T.BED.reqDoor[bed + 1] + 1) + ' chahiye' : '');
  add('door', '🚪 Door', door + 1, T.DOOR);
  add('at', at < 0 ? '🔫 Turret banao' : '🔫 Turret', at + 1, T.AT, T.AT.reqGame[at + 1] != null && game < T.AT.reqGame[at + 1] ? ' · Console L' + (T.AT.reqGame[at + 1] + 1) + ' chahiye' : '');
  add('game', game < 0 ? '🎮 Console banao' : '🎮 Console', game + 1, T.GAME);
  if (dHp < dMax || bHp < bMax) rows.push(`<button data-w="repair" class="sec">🔧 Repair<small>Door ${dHp}/${dMax} · Bed ${bHp}/${bMax}</small></button>`);
  $('upgs').innerHTML = rows.join('');
}
$('upgs').addEventListener('pointerdown', (e) => { const b = e.target.closest('button[data-w]'); if (b) { send({ t: 'up', w: b.dataset.w }); e.preventDefault(); } });
$('sleepBtn').addEventListener('pointerdown', (e) => { send({ t: 'sleep' }); e.preventDefault(); });
$('atkBtn').addEventListener('pointerdown', (e) => { send({ t: 'atk' }); e.preventDefault(); });
let atkTimer; $('atkBtn').addEventListener('pointerdown', () => { clearInterval(atkTimer); atkTimer = setInterval(() => send({ t: 'atk' }), 250); });
['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => $('atkBtn').addEventListener(ev, () => clearInterval(atkTimer)));

function inMyRoom() {
  const mp = myPlayer(); if (!mp || !G) return false;
  const ri = G.rooms.find((r) => r[1] === G.you); if (!ri) return false;
  const tx = Math.floor(mp[1]), ty = Math.floor(mp[2]);
  return G.init.rooms[ri[0]].tiles.some((t) => t.x === tx && t.y === ty);
}

/* ---------------- input ---------------- */
const keys = {};
addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (!G) return;
  if (e.key === ' ' || e.key.toLowerCase() === 'e') send({ t: G.role === 'demon' ? 'atk' : 'sleep' });
  if (G.role !== 'demon') { const map = { 1: 'bed', 2: 'door', 3: 'at', 4: 'game', 5: 'repair' }; if (map[e.key]) send({ t: 'up', w: map[e.key] }); }
});
addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
let stickVec = { x: 0, y: 0 }, stickId = null;
const stick = $('stick'), knob = $('knob');
function stickMove(e) {
  const r = stick.getBoundingClientRect(), cxx = r.left + r.width / 2, cyy = r.top + r.height / 2;
  let dx = e.clientX - cxx, dy = e.clientY - cyy; const m = Math.hypot(dx, dy), max = r.width / 2;
  if (m > max) { dx *= max / m; dy *= max / m; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  stickVec = m < 10 ? { x: 0, y: 0 } : { x: dx / max, y: dy / max };
}
stick.addEventListener('pointerdown', (e) => { stickId = e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e); e.preventDefault(); });
stick.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) stickMove(e); });
const stickEnd = (e) => { if (e.pointerId === stickId) { stickId = null; stickVec = { x: 0, y: 0 }; knob.style.transform = ''; } };
stick.addEventListener('pointerup', stickEnd); stick.addEventListener('pointercancel', stickEnd);
setInterval(() => {
  if (!G || G.over) return;
  let x = stickVec.x, y = stickVec.y;
  const kx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  const ky = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  if (kx || ky) { const m = Math.hypot(kx, ky); x = kx / m; y = ky / m; }
  x = Math.round(x * 100) / 100; y = Math.round(y * 100) / 100;
  const k = x + ',' + y;
  if (k !== G.lastSent || (x || y) && Date.now() % 1000 < 55) { G.lastSent = k; send({ t: 'in', x, y }); }
}, 50);

/* ---------------- render ---------------- */
function lerpEnt(a, b, t) { return a + (b - a) * t; }
function interp() {
  const c = G.cur, p = G.prev; if (!c) return null;
  let t = 1;
  if (p) { const span = c.arr - p.arr; t = span > 0 ? Math.min(1.2, (performance.now() - c.arr) / span) : 1; }
  const pl = {};
  c.p.forEach((e) => { const pe = p && p.p.find((q) => q[0] === e[0]); pl[e[0]] = pe ? [lerpEnt(pe[1], e[1], t), lerpEnt(pe[2], e[2], t)] : [e[1], e[2]]; });
  const g = c.g, pg = p && p.g;
  return { pl, g: pg ? [lerpEnt(pg[0], g[0], t), lerpEnt(pg[1], g[1], t)] : [g[0], g[1]] };
}
function frame() {
  if (!G) return;
  requestAnimationFrame(frame);
  if (!G.cur) return;
  const I = G.init, S = interp(), now = performance.now();
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.fillStyle = '#0a0714'; cx.fillRect(0, 0, W, H);
  // camera
  const mp = myPlayer();
  let fx, fy;
  if (G.role === 'demon' || !mp || mp[3] === 2) { fx = S.g[0]; fy = S.g[1]; } else { const q = S.pl[G.you]; fx = q[0]; fy = q[1]; }
  G.cam.x += (fx - G.cam.x) * 0.25; G.cam.y += (fy - G.cam.y) * 0.25;
  const ox = W / 2 - G.cam.x * TS, oy = H * 0.45 - G.cam.y * TS;
  const X = (x) => Math.round(x * TS + ox), Y = (y) => Math.round(y * TS + oy);
  const x0 = Math.max(0, Math.floor(-ox / TS)), x1 = Math.min(I.cols - 1, Math.ceil((W - ox) / TS));
  const y0 = Math.max(0, Math.floor(-oy / TS)), y1 = Math.min(I.rows - 1, Math.ceil((H - oy) / TS));
  // tiles
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const l = +I.land[y][x]; if (l >= 8) continue;
    const px = X(x), py = Y(y), s = TS + 1;
    let ok = false;
    if (l <= 1) ok = spr('map', 'floor_' + (l + 1), px, py, s);
    else ok = spr('map', 'wall_' + (l - 1), px, py, s);
    if (!ok) { cx.fillStyle = l <= 1 ? '#3b3350' : '#171126'; cx.fillRect(px, py, s, s); }
  }
  // rooms
  const colorOf = (owner) => COLORS[(owner >= 0 ? owner : 6) % 7];
  for (const r of G.rooms) {
    const [i, owner, bed, door, dHp, dMax, bHp, bMax, at, game, closed, dead] = r, R = I.rooms[i];
    const own = G.cur.p.find((p) => p[0] === owner);
    // owner marker on floor
    cx.fillStyle = colorOf(owner) + '33';
    for (const t of R.tiles) cx.fillRect(X(t.x), Y(t.y), TS, TS);
    spr('build', 'bed_' + (bed + 1), X(R.bed.x), Y(R.bed.y), TS) || (cx.fillStyle = '#c0a', cx.fillRect(X(R.bed.x) + 4, Y(R.bed.y) + 4, TS - 8, TS - 8));
    if (at >= 0) spr('Atower', 'at_' + (at + 1), X(R.turret.x), Y(R.turret.y), TS);
    if (game >= 0) spr('build', 'game_' + (game + 1), X(R.game.x), Y(R.game.y), TS);
    const dx = X(R.door.x), dy = Y(R.door.y);
    spr('build', 'door_' + (door + 1), dx, dy, TS, dHp <= 0 ? 0.12 : closed ? 1 : 0.4) || (cx.fillStyle = closed ? '#a63' : '#a636', cx.fillRect(dx + 3, dy + 3, TS - 6, TS - 6));
    if (dHp > 0 && dHp < dMax) { cx.fillStyle = '#000a'; cx.fillRect(dx, dy - 6, TS, 5); cx.fillStyle = '#ff6b6b'; cx.fillRect(dx, dy - 6, TS * dHp / dMax, 5); }
    if (bHp < bMax && bHp > 0) { const bx = X(R.bed.x), by = Y(R.bed.y); cx.fillStyle = '#000a'; cx.fillRect(bx, by - 6, TS, 5); cx.fillStyle = '#ff9a5d'; cx.fillRect(bx, by - 6, TS * bHp / bMax, 5); }
    // name tag
    cx.font = 'bold ' + Math.round(TS * 0.26) + 'px system-ui'; cx.textAlign = 'center';
    const nm = G.cur.p.find((p) => p[0] === owner) ? (owner === G.you ? 'TUM' : pname(owner)) : '';
    if (nm) { cx.fillStyle = '#000b'; cx.fillRect(dx - 8, dy + TS * 0.62 - 12 + (R.door.y > R.bed.y ? TS : -TS * 0.9), TS + 16, 15); cx.fillStyle = colorOf(owner); cx.fillText(nm, dx + TS / 2, dy + TS * 0.62 + (R.door.y > R.bed.y ? TS : -TS * 0.9)); }
    if (dead) { cx.fillStyle = '#000a'; for (const t of R.tiles) cx.fillRect(X(t.x), Y(t.y), TS, TS); }
  }
  // shots
  G.shots = G.shots.filter((s) => s.until > now);
  cx.strokeStyle = '#ffe066'; cx.lineWidth = 3;
  for (const s of G.shots) { const R = I.rooms[s.ri]; cx.beginPath(); cx.moveTo(X(R.turret.x + 0.5), Y(R.turret.y + 0.5)); cx.lineTo(X(S.g[0]), Y(S.g[1])); cx.stroke(); }
  // players
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (const p of G.cur.p) {
    const [id, , , st] = p; const q = S.pl[id]; if (st === 2) { cx.font = Math.round(TS * 0.6) + 'px system-ui'; cx.fillText('💀', X(q[0]), Y(q[1])); continue; }
    const px = X(q[0]), py = Y(q[1]), rad = TS * 0.3;
    cx.fillStyle = colorOf(id); cx.beginPath(); cx.arc(px, py, rad, 0, 7); cx.fill();
    cx.lineWidth = id === G.you ? 3 : 1.5; cx.strokeStyle = id === G.you ? '#fff' : '#0008'; cx.stroke();
    cx.font = Math.round(TS * 0.34) + 'px system-ui'; cx.fillStyle = '#fff'; cx.fillText(st === 1 ? '😴' : '🙂', px, py + 1);
    if (id !== G.you) { cx.font = 'bold ' + Math.round(TS * 0.24) + 'px system-ui'; cx.fillStyle = '#fff'; cx.fillText(pname(id), px, py - rad - 7); }
  }
  // ghost
  const g = G.cur.g;
  if (g[5] !== 0) {
    const gx = X(S.g[0]), gy = Y(S.g[1]);
    cx.globalAlpha = g[5] === 2 ? 0.5 : 1; cx.font = Math.round(TS * 0.95) + 'px system-ui'; cx.fillText('👻', gx, gy);
    cx.globalAlpha = 1;
    cx.fillStyle = '#000a'; cx.fillRect(gx - TS * 0.5, gy - TS * 0.7, TS, 6); cx.fillStyle = '#ff4d5e'; cx.fillRect(gx - TS * 0.5, gy - TS * 0.7, TS * Math.max(0, g[2] / g[3]), 6);
    if (G.role === 'demon') { cx.font = 'bold ' + Math.round(TS * 0.26) + 'px system-ui'; cx.fillStyle = '#fff'; cx.fillText('TUM', gx, gy + TS * 0.7); }
  }
}
function pname(id) { return (G.names && G.names[id]) || 'P' + (id + 1); }
</script>
